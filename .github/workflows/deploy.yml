name: Deploy Akanbi Calculator App

on:
  push:
    branches:
      - main

jobs:
  deploy-static-files:
    name: Pull Code Directly to Server Webroot
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            # Clean up all existing files and subdirectories inside public_html safely
            find public_html/ -mindepth 1 -delete
            
            # Clone the Zion-calc repo directly into the public_html root directory
            git clone https://github.com/Z-AKB/Zion-calc public_html/